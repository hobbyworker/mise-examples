[tools]
hugo-extended = "0.167.0"

[settings]
idiomatic_version_file_enable_tools = ["go"]

[tasks.build]
description = "Build the site"
run = "hugo --gc --minify"

[tasks.serve]
description = "Start the local server"
run = "hugo server --buildDrafts"

[tasks.check]
description = "Check that the post was built"
run = "test -f public/posts/hello/index.html && echo 'public/posts/hello/index.html is there'"

[tasks.ci]
description = "Run the CI checks"
run = [{ task = "build" }, { task = "check" }]
